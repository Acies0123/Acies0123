<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Step Tracker · Windsor & Tudor</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <div class="logo"><span class="brand-mark">⚜</span><div><b>Step Tracker</b><small>Houses of Windsor &amp; Tudor</small></div></div>

    <button data-view="dashboard" class="on">Dashboard</button>
